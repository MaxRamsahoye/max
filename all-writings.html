<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Writings</title>
    <meta name="description" content="A complete list of Max Ramsahoye’s writings, grouped by collection.">

    <link id="favicon" rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22 font-family=%22Georgia, serif%22 font-weight=%22bold%22 fill=%22%23ffffff%22>M</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

    <style>
        /* Second typeface (toggle with f): ET Bembo, self-hosted from fonts/et-book (MIT licence) */
        @font-face { font-family: 'ET Bembo'; src: url('fonts/et-book/et-book-roman-line-figures.woff') format('woff'); font-weight: 300 500; font-style: normal; font-display: swap; }
        @font-face { font-family: 'ET Bembo'; src: url('fonts/et-book/et-book-display-italic-old-style-figures.woff') format('woff'); font-weight: 300 500; font-style: italic; font-display: swap; }
        @font-face { font-family: 'ET Bembo'; src: url('fonts/et-book/et-book-semi-bold-old-style-figures.woff') format('woff'); font-weight: 600; font-style: normal; font-display: swap; }
        @font-face { font-family: 'ET Bembo'; src: url('fonts/et-book/et-book-bold-line-figures.woff') format('woff'); font-weight: 700 900; font-style: normal; font-display: swap; }
        :root { --font-body: 'Cormorant Garamond', serif; }
        html.font-bembo { --font-body: 'ET Bembo', Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif; }

        :root {
            --bg-color: #0a0e1f;
            --text-main: #d8dbe8;
            --accent-color: #ffffff;
            --text-muted: #767c99;
            --border-color: #1a1f38;
        }

        body.theme-dark {
            --bg-color: #1a1c23;
            --text-main: #e2e4e9;
            --accent-color: #ffffff;
            --text-muted: #8b92a5;
            --border-color: #2d313d;
        }

        body.theme-light {
            --bg-color: #f4ecd8;
            --text-main: #3a332a;
            --accent-color: #000000;
            --text-muted: #7a6e60;
            --border-color: #d5c7b3;
        }

        body.theme-pure-white {
            --bg-color: #ffffff;
            --text-main: #111111;
            --accent-color: #000000;
            --text-muted: #666666;
            --border-color: #eeeeee;
        }

        body.theme-pure-black {
            --bg-color: #000000;
            --text-main: #eeeeee;
            --accent-color: #ffffff;
            --text-muted: #888888;
            --border-color: #222222;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scrollbar-width: none; -ms-overflow-style: none; }
        html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; }

        /* Scroll Progress Bar (replaces native scrollbar, as on the main page) */
        #progress-bar-track { position: fixed; top: 0; right: 0; width: 4px; height: 100vh; background-color: var(--border-color); z-index: 100000; pointer-events: none; transition: background-color 0.4s ease; }
        #progress-bar { width: 100%; height: 0%; background-color: var(--accent-color); transition: background-color 0.4s ease; }

        /* Theme toggle (top right, as on the main page) */
        #top-right-bar { position: absolute; top: 25px; right: 25px; display: flex; align-items: center; gap: 15px; z-index: 99999; }
        .theme-btn { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(128, 128, 128, 0.5); cursor: pointer; transition: transform 0.3s ease, border-color 0.3s ease, background-color 0.4s ease; }
        .theme-btn:hover { transform: scale(1.15); }
        .theme-info-container { position: relative; display: flex; align-items: center; justify-content: center; }
        .info-icon { display: inline-flex; color: var(--text-muted); transition: color 0.3s ease, transform 0.3s ease; margin-top: 2px; }
        .theme-info-container:hover .info-icon { color: var(--accent-color); transform: scale(1.1); }
        .theme-tooltip { position: absolute; top: 100%; right: 0; margin-top: 12px; background-color: var(--border-color); color: var(--text-main); padding: 6px 12px; border-radius: 4px; font-size: 0.95rem; font-weight: 600; white-space: nowrap; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s ease; transform: translateY(-5px); pointer-events: none; }
        .theme-info-container:hover .theme-tooltip { opacity: 1; visibility: visible; transform: translateY(0); }

        body {
            background-color: var(--bg-color);
            font-family: var(--font-body);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            transition: background-color 0.4s ease, color 0.4s ease, opacity 0.45s ease;
        }

        /* Page transition: fade in on arrival, fade out before leaving */
        body.page-hidden, html.page-enter body { opacity: 0; }

        main { max-width: 820px; margin: 0 auto; padding: 88px 16px 120px; }

        /* Top-left, vertically centred with the theme toggle in the top right */
        .back-link { position: absolute; top: 25px; left: 25px; height: 22px; display: flex; align-items: center; font-size: 1.4rem; color: var(--text-muted); text-decoration: none; z-index: 99999; transition: color 0.3s ease; }
        .back-link:hover { color: var(--accent-color); }

        h1 { font-size: 3rem; font-weight: 600; color: var(--accent-color); margin-top: 40px; line-height: 1.2; }
        .page-sub { font-size: 1.25rem; color: var(--text-muted); margin-top: 8px; }

        /* Collection filter menu */
        .filters { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 30px; }
        .filter-btn { background: none; border: none; padding: 2px 0; font-family: inherit; font-size: 1.15rem; font-weight: 600; color: var(--text-muted); cursor: pointer; text-align: left; transition: color 0.3s ease; }
        .filter-btn:hover { color: var(--text-main); }
        .filter-btn .n { font-weight: 400; font-size: 0.9rem; margin-right: 6px; }
        .filter-btn .label { border-bottom: 1px solid transparent; transition: border-color 0.3s ease; }
        .filter-btn[aria-pressed="true"] { color: var(--accent-color); }
        .filter-btn[aria-pressed="true"] .label { border-bottom-color: var(--accent-color); }
        /* Vertical divider between collection groups; kept in one flex item with the group's last button so it never starts a line */
        .filter-tail { display: inline-flex; align-items: center; gap: 24px; }
        .filter-divider { width: 1px; height: 1.2rem; background-color: var(--accent-color); opacity: 0.5; transition: background-color 0.4s ease; }
        .collection[hidden], .collection-group[hidden] { display: none; }

        .collection-group { margin-top: 50px; }

        /* Section divider (same line and sliding dot as on the main page) */
        .section-divider { width: 100%; pointer-events: none; }
        .section-divider-hitbox { position: relative; width: 100%; height: 22px; display: flex; align-items: center; pointer-events: auto; cursor: pointer; }
        .section-divider-line { width: 100%; height: 22px; overflow: visible; display: block; }
        .section-divider-line path { fill: none; stroke: var(--accent-color); stroke-width: 1px; vector-effect: non-scaling-stroke; opacity: 0.5; transition: stroke 0.4s ease; }
        .section-divider-hitbox .geo-node { position: absolute; top: 50%; left: 0; margin-top: -4px; margin-left: -4px; width: 8px; height: 8px; background-color: var(--accent-color); border-radius: 50%; transition: background-color 0.4s ease; transform: translateZ(0); animation: slideDot 15s linear infinite alternate; will-change: transform; }
        .section-divider--flip .section-divider-hitbox .geo-node { animation-direction: alternate-reverse; }
        @keyframes slideDot { from { left: 0%; } to { left: 100%; } }
        .collection { margin-top: 64px; }
        .collection h2 { display: flex; align-items: baseline; gap: 15px; font-size: 1.7rem; font-weight: 600; color: var(--accent-color); line-height: 1.3; }
        .collection h2 .count { flex: none; min-width: 22px; text-align: right; font-size: 1.05rem; font-weight: 400; color: var(--text-muted); }

        .collection h3 { font-size: 1.35rem; font-style: italic; font-weight: 400; color: var(--text-muted); margin: 32px 0 6px 37px; }

        .collection ul { list-style: none; margin-top: 14px; padding-left: 63px; }
        .collection li { position: relative; font-size: 1.45rem; padding: 9px 0; }
        /* Diamond outline bullets, hung in the left gutter so titles stay aligned with the heading */
        /* Half the cap height of each typeface: where the bullet's centre sits above the baseline */
        :root { --bullet-raise: 0.32em; }
        html.font-bembo { --bullet-raise: 0.34em; }
        /* Inline so it sits on the text's own baseline: its centre is raised half the cap height (--bullet-raise) above the baseline,
           lining up with the middle of the capitals at any font size. The margins hang it 20px into the gutter without
           moving the text (-20 + 6 + 14 = 0). */
        .collection li::before { content: ''; display: inline-block; box-sizing: border-box; width: 6px; height: 6px; margin: 0 14px 0 -20px; vertical-align: calc(var(--bullet-raise) - 3px); border: 1px solid var(--text-muted); transform: rotate(45deg); transition: border-color 0.4s ease; }
        .collection li a { color: var(--accent-color); font-weight: 500; text-decoration: none; transition: color 0.4s ease; }
        .collection li a:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
        .collection li.group-label { color: var(--text-muted); }
        .collection li.nested { padding-left: 24px; }

        /* Back to top (as on the main page) */
        #back-to-top { position: fixed; bottom: 30px; right: 30px; width: 45px; height: 45px; background-color: var(--bg-color); color: var(--accent-color); border: 1px solid var(--border-color); border-radius: 50%; font-size: 1.2rem; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease, background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease; text-decoration: none; z-index: 999; }
        #back-to-top.visible { opacity: 1; pointer-events: auto; }
        #back-to-top:hover, #back-to-top.key-pressed { background-color: var(--accent-color); color: var(--bg-color); transform: translateY(-4px); }

        .status { margin-top: 50px; font-size: 1.25rem; color: var(--text-muted); }
        .status a { color: var(--accent-color); }

        @media (max-width: 600px) {
            main { padding-top: 98px; }
            #top-right-bar { top: 20px; right: 20px; }
            .back-link { top: 20px; left: 16px; font-size: 1.3rem; }
            h1 { font-size: 2.4rem; }
            .collection h2 { font-size: 1.45rem; gap: 10px; }
            .collection h3 { margin-left: 32px; font-size: 1.25rem; }
            .collection ul { padding-left: 52px; }
            .collection li { font-size: 1.3rem; }
            .filters { gap: 6px 18px; }
            .filter-tail { gap: 18px; }
            .filter-btn { font-size: 1.05rem; }
        }
    </style>
    <script>
        // Applied before the body exists so the page arrives in the right theme and font, hidden, then fades in
        (function () {
            function applyBemboEarly() {
                document.documentElement.classList.add('font-bembo');
                ['et-book-roman-line-figures', 'et-book-display-italic-old-style-figures', 'et-book-semi-bold-old-style-figures'].forEach(name => {
                    const link = document.createElement('link');
                    link.rel = 'preload'; link.as = 'font'; link.type = 'font/woff'; link.crossOrigin = 'anonymous';
                    link.href = `fonts/et-book/${name}.woff`;
                    document.head.appendChild(link);
                });
            }
            const colours = { 'midnight-blue': '#0a0e1f', 'dark': '#1a1c23', 'light': '#f4ecd8', 'pure-white': '#ffffff', 'pure-black': '#000000' };
            const params = new URLSearchParams(location.search);
            if (params.get('font') === 'bembo') applyBemboEarly();
            const theme = params.get('theme');
            window.initialTheme = colours[theme] ? theme : 'midnight-blue';
            document.documentElement.classList.add('page-enter');
            document.documentElement.style.backgroundColor = colours[window.initialTheme];
            setTimeout(() => document.documentElement.classList.remove('page-enter'), 1500);
        })();
    </script>
</head>
<body>
    <script>
        if (window.initialTheme !== 'midnight-blue') document.body.classList.add(`theme-${window.initialTheme}`);
    </script>
    <div id="progress-bar-track" aria-hidden="true"><div id="progress-bar"></div></div>

    <div id="top-right-bar">
        <button id="theme-toggle-btn" class="theme-btn" style="background-color: #0a0e1f;" aria-label="Toggle Theme" title="Toggle Theme"></button>
        <div class="theme-info-container">
            <svg class="info-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            <div class="theme-tooltip">click or (t) to toggle themes &middot; (f) to toggle fonts</div>
        </div>
    </div>

    <a href="index.html#writings" class="back-link">&larr; Max Ramsahoye</a>

    <main>
        <h1>All Writings</h1>
        <p class="page-sub" id="summary">&nbsp;</p>
        <div class="filters" id="filters" role="group" aria-label="Filter by collection"></div>
        <div id="collections">
            <p class="status">Loading&hellip;</p>
        </div>
    </main>

    <a href="#" id="back-to-top" aria-label="Back to top" title="Back to top">&uarr;</a>

    <script>
        // --- Theme (carried over from the main page via ?theme=, 't' cycles) ---
        const themes = ['midnight-blue', 'dark', 'light', 'pure-white', 'pure-black'];
        const themeSwatchColors = {
            'midnight-blue': '#0a0e1f',
            'dark': '#1a1c23',
            'light': '#f4ecd8',
            'pure-white': '#ffffff',
            'pure-black': '#000000'
        };
        let currentThemeIndex = 0;

        function setTheme(themeName) {
            document.body.classList.remove('theme-dark', 'theme-light', 'theme-pure-white', 'theme-pure-black');
            if (themeName !== 'midnight-blue') {
                document.body.classList.add(`theme-${themeName}`);
            }
            document.getElementById('theme-toggle-btn').style.backgroundColor = themeSwatchColors[themeName];
            const fill = (themeName === 'light' || themeName === 'pure-white') ? '%23000000' : '%23ffffff';
            document.getElementById('favicon').href = `data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22 font-family=%22Georgia, serif%22 font-weight=%22bold%22 fill=%22${fill}%22>M</text></svg>`;
            currentThemeIndex = themes.indexOf(themeName);
        }

        setTheme(window.initialTheme || 'midnight-blue');

        document.getElementById('theme-toggle-btn').addEventListener('click', () => {
            setTheme(themes[(currentThemeIndex + 1) % themes.length]);
        });

        // --- Scroll progress bar & back-to-top button ---
        const progressBar = document.getElementById('progress-bar');
        const backToTopBtn = document.getElementById('back-to-top');
        function updateProgress() {
            const scrollTop = document.documentElement.scrollTop;
            const scrollable = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            progressBar.style.height = (scrollable > 0 ? (scrollTop / scrollable) * 100 : 0) + '%';
            backToTopBtn.classList.toggle('visible', scrollTop > 200);
        }
        backToTopBtn.addEventListener('click', (e) => {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        // Backspace shows the arrow's hover state briefly, as if it had been hovered and clicked
        let backToTopFlashTimer;
        function flashBackToTop() {
            backToTopBtn.classList.add('key-pressed');
            clearTimeout(backToTopFlashTimer);
            backToTopFlashTimer = setTimeout(() => backToTopBtn.classList.remove('key-pressed'), 600);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace') {
                e.preventDefault();
                flashBackToTop();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });
        window.addEventListener('scroll', updateProgress, { passive: true });
        window.addEventListener('resize', updateProgress);

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 't') {
                setTheme(themes[(currentThemeIndex + 1) % themes.length]);
            }
        });

        // --- Font toggle (f): Cormorant Garamond <-> ET Bembo ---
        // The new faces are loaded before switching so the text never flashes in a fallback font
        function setFont(bembo) {
            document.documentElement.classList.toggle('font-bembo', bembo);
            updateProgress();
        }
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() !== 'f' || e.ctrlKey || e.metaKey || e.altKey) return;
            const toBembo = !document.documentElement.classList.contains('font-bembo');
            const ready = toBembo && document.fonts
                ? Promise.all(['400 1em "ET Bembo"', 'italic 400 1em "ET Bembo"', '600 1em "ET Bembo"'].map(f => document.fonts.load(f))).catch(() => {})
                : Promise.resolve();
            ready.then(() => setFont(toBembo));
        });


        // --- Page transitions ---
        let revealed = false;
        function revealPage() {
            if (revealed) return;
            revealed = true;
            requestAnimationFrame(() => requestAnimationFrame(() => {
                document.documentElement.classList.remove('page-enter');
                document.documentElement.style.backgroundColor = '';
            }));
        }
        setTimeout(revealPage, 800);

        // Tell the main page to skip its loading screen (and keep this theme and font) when we go back to it,
        // whether by the back link or the browser's back button
        window.addEventListener('pagehide', () => {
            try {
                sessionStorage.setItem('mr-return-from-all-writings', themes[currentThemeIndex]);
                sessionStorage.setItem('mr-return-font-from-all-writings', document.documentElement.classList.contains('font-bembo') ? 'bembo' : 'cormorant');
            } catch (e) {}
        });

        // Restored from the back/forward cache after fading out: show the page again
        window.addEventListener('pageshow', (e) => {
            if (e.persisted) document.body.classList.remove('page-hidden');
        });

        document.querySelector('.back-link').addEventListener('click', (e) => {
            if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
            e.preventDefault();
            const href = e.currentTarget.href;
            document.body.classList.add('page-hidden');
            setTimeout(() => { location.href = href; }, 450);
        });

        // --- Build the list from the Writings section of the main page ---
        // Keep inline italics from the original title, drop the leading dash on sub-entries
        function cleanTitle(h3) {
            const span = document.createElement('span');
            h3.childNodes.forEach(n => {
                if (n.nodeType === Node.TEXT_NODE) span.appendChild(document.createTextNode(n.textContent));
                else if (n.nodeName === 'EM' || n.nodeName === 'I') { const em = document.createElement('em'); em.textContent = n.textContent; span.appendChild(em); }
                else span.appendChild(document.createTextNode(n.textContent));
            });
            span.normalize();
            const first = span.firstChild;
            if (first && first.nodeType === Node.TEXT_NODE) first.textContent = first.textContent.replace(/^\s*—\s*/, '');
            return span;
        }

        function readEntries(container) {
            const items = [];
            container.querySelectorAll('li').forEach(li => {
                li.querySelectorAll('.project-title-wrapper').forEach(wrapper => {
                    const h3 = wrapper.querySelector('h3');
                    if (!h3) return;
                    const link = wrapper.querySelector('a[href]');
                    if (link) {
                        items.push({ title: cleanTitle(h3), href: link.getAttribute('href'), nested: wrapper !== li.querySelector('.project-title-wrapper') });
                    } else {
                        items.push({ title: cleanTitle(h3), label: true });
                    }
                });
            });
            return items;
        }

        function parseWritings(doc) {
            const groups = [[]];
            doc.querySelectorAll('#writings .tabs-nav > .tab-btn, #writings .tabs-nav > .tab-break').forEach(el => {
                if (el.classList.contains('tab-break')) { groups.push([]); return; }
                const match = (el.getAttribute('onclick') || '').match(/openTab\(event,\s*'([^']+)'\)/);
                const tab = match && doc.getElementById(match[1]);
                if (!tab) return;
                const name = el.querySelector('.tab-title-text').textContent.trim();
                const subtabs = [...tab.querySelectorAll('.subtab-content')];
                const sections = subtabs.length
                    ? subtabs.map(sub => {
                        const btn = tab.querySelector(`[onclick*="'${sub.id}'"]`);
                        return { name: btn ? btn.textContent.trim() : '', items: readEntries(sub) };
                    })
                    : [{ name: '', items: readEntries(tab) }];
                groups[groups.length - 1].push({ name, sections });
            });
            return groups.filter(g => g.length);
        }

        // --- Collection filter: "All" on by default. Picking a collection while "All" is on shows just that one;
        // further picks add or remove collections, and deselecting the last one goes back to "All". ---
        const collectionViews = [];
        let selected = new Set();

        function pluralise(n, word) { return `${n} ${word}${n === 1 ? '' : 's'}`; }

        function updateView() {
            const showAll = selected.size === 0;
            let entries = 0, collections = 0;
            collectionViews.forEach((view, i) => {
                const visible = showAll || selected.has(i);
                view.section.hidden = !visible;
                view.button.setAttribute('aria-pressed', String(!showAll && selected.has(i)));
                if (visible) { entries += view.count; collections++; }
            });
            document.getElementById('filter-all').setAttribute('aria-pressed', String(showAll));
            document.querySelectorAll('.collection-group').forEach(group => {
                group.hidden = !group.querySelector('.collection:not([hidden])');
            });
            document.getElementById('summary').textContent = `${pluralise(entries, 'writing')} across ${pluralise(collections, 'collection')}.`;
            updateProgress();
        }

        function makeFilterButton(name, count) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'filter-btn';
            if (count !== undefined) {
                const n = document.createElement('span');
                n.className = 'n';
                n.textContent = count;
                btn.appendChild(n);
            }
            const label = document.createElement('span');
            label.className = 'label';
            label.textContent = name;
            btn.appendChild(label);
            return btn;
        }

        function buildFilters() {
            const filters = document.getElementById('filters');
            const allBtn = makeFilterButton('All');
            allBtn.id = 'filter-all';
            allBtn.addEventListener('click', () => { selected.clear(); updateView(); });
            filters.appendChild(allBtn);

            collectionViews.forEach((view, i) => {
                view.button = makeFilterButton(view.name, view.count);
                view.button.addEventListener('click', () => {
                    if (selected.has(i)) selected.delete(i);
                    else selected.add(i);
                    updateView();
                });
                const next = collectionViews[i + 1];
                if (next && next.group !== view.group) {
                    const tail = document.createElement('span');
                    tail.className = 'filter-tail';
                    const divider = document.createElement('span');
                    divider.className = 'filter-divider';
                    divider.setAttribute('aria-hidden', 'true');
                    tail.append(view.button, divider);
                    filters.appendChild(tail);
                } else {
                    filters.appendChild(view.button);
                }
            });
            updateView();
        }

        // Divider line with a sliding dot that speeds up on hover, alternating direction like the main page
        function makeDivider(flip) {
            const divider = document.createElement('div');
            divider.className = 'section-divider' + (flip ? ' section-divider--flip' : '');
            divider.setAttribute('aria-hidden', 'true');
            divider.innerHTML = '<div class="section-divider-hitbox"><svg class="section-divider-line" viewBox="0 0 1155 22" preserveAspectRatio="none"><path d="M0,11 L1155,11"></path></svg><div class="geo-node"></div></div>';
            const hitbox = divider.firstChild;
            const dot = hitbox.querySelector('.geo-node');
            hitbox.addEventListener('mouseenter', () => dot.getAnimations().forEach(anim => anim.playbackRate = 2));
            hitbox.addEventListener('mouseleave', () => dot.getAnimations().forEach(anim => anim.playbackRate = 1));
            return divider;
        }

        function render(groups) {
            const root = document.getElementById('collections');
            root.innerHTML = '';

            groups.forEach((group, groupIndex) => {
                const groupEl = document.createElement('div');
                groupEl.className = 'collection-group';
                groupEl.appendChild(makeDivider(groupIndex % 2 === 1));

                group.forEach(collection => {
                    const count = collection.sections.reduce((n, s) => n + s.items.filter(i => !i.label).length, 0);

                    const section = document.createElement('section');
                    section.className = 'collection';
                    const h2 = document.createElement('h2');
                    const countEl = document.createElement('span');
                    countEl.className = 'count';
                    countEl.textContent = count;
                    h2.append(countEl, document.createTextNode(collection.name));
                    section.appendChild(h2);

                    collection.sections.forEach(sub => {
                        if (sub.name) {
                            const h3 = document.createElement('h3');
                            h3.textContent = sub.name;
                            section.appendChild(h3);
                        }
                        const ul = document.createElement('ul');
                        sub.items.forEach(item => {
                            const li = document.createElement('li');
                            if (item.label) {
                                li.className = 'group-label';
                                li.appendChild(item.title);
                            } else {
                                if (item.nested) li.className = 'nested';
                                const a = document.createElement('a');
                                a.href = item.href;
                                a.target = '_blank';
                                a.rel = 'noopener';
                                a.appendChild(item.title);
                                li.appendChild(a);
                            }
                            ul.appendChild(li);
                        });
                        section.appendChild(ul);
                    });
                    groupEl.appendChild(section);
                    collectionViews.push({ name: collection.name, count, section, group: groupIndex });
                });
                root.appendChild(groupEl);
            });

            buildFilters();
        }

        fetch('index.html')
            .then(res => { if (!res.ok) throw new Error(res.status); return res.text(); })
            .then(html => {
                const groups = parseWritings(new DOMParser().parseFromString(html, 'text/html'));
                if (!groups.length) throw new Error('no collections found');
                render(groups);
                revealPage();
            })
            .catch(() => {
                document.getElementById('collections').innerHTML =
                    '<p class="status">The list couldn’t be loaded. <a href="index.html#writings">View the writings on the main page</a>.</p>';
                revealPage();
            });
    </script>
</body>
</html>
